<div class="container" id="app">

        <button class="topic-btn" onclick="startFullTest()">📋 Полный тест (41 вопрос + 6 задач)</button>
        <button class="topic-btn" onclick="startTheoryOnly()">📖 Только теория (Вопросы 1-41)</button>
        <button class="topic-btn" onclick="startProblemsOnly()">🧮 Только задачи (6 шт)</button>
        <button class="topic-btn" style="border-color:#4caf50; color:#4caf50;" onclick="showReference()">📖 Справочник с ответами</button>
        <button class="back-btn" onclick="goHome()">🏠 На главную</button>
    </div>

    <!-- Экран теста -->
    <div class="test-screen" id="testScreen">
        <div class="timer-bar" id="timerBar" style="display:none;"><div class="timer-progress"><div class="timer-fill" id="timerFill"></div></div><span id="timerText">0с</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="question-meta"><span id="questionNumber"></span><span id="originalNumber"></span></div>
        <div class="question" id="questionText"></div>
        <div class="answers" id="answersContainer"></div>
        <div class="nav-buttons"><button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()">← Назад</button><button class="nav-btn next" id="nextBtn" onclick="nextQuestion()" disabled>Выберите ответ</button></div>
        <button class="back-btn" onclick="confirmExit()">↩ Выйти в меню</button>
    </div>

    <!-- Экран результата -->
    <div class="result-screen" id="resultScreen">
        <h2>📊 Результаты</h2>
        <div class="result-summary"><div class="result-card"><div class="number" id="totalQuestions">0</div><div class="label">Вопросов</div></div><div class="result-card"><div class="number" id="correctAnswers">0</div><div class="label">Правильных</div></div><div class="result-card"><div class="number" id="percentage">0%</div><div class="label">Процент</div></div><div class="result-card"><div class="number" id="timeElapsed">0:00</div><div class="label">Время</div></div></div>
        <div class="grade" id="grade"></div>
        <div class="result-details" id="resultDetails"></div>
        <div style="background:var(--card-bg); border-radius:12px; padding:15px; margin-bottom:20px;"><h3 style="text-align:center;">🏆 Топ-10</h3><div id="leaderboardList"></div><div style="display:flex; gap:10px; margin-top:10px;"><input type="text" id="leaderName" placeholder="Ваше имя" style="flex:1; background:var(--input-bg); border:1px solid var(--input-border); color:var(--text); padding:8px; border-radius:8px;"><button onclick="saveResult()" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px;">💾 Сохранить</button></div></div>
        <div class="result-buttons"><button class="nav-btn next" onclick="retryTest()">🔄 Заново</button><button class="nav-btn prev" onclick="showReference()">📖 Ответы</button><button class="nav-btn prev" onclick="goHome()">🏠 Меню</button></div>
    </div>

    <!-- Экран справочника -->
    <div class="reference-screen" id="referenceScreen"><h2>📖 Справочник: все правильные ответы</h2><div class="reference-content" id="referenceContent"></div><button class="back-btn" onclick="goHome()">↩ Вернуться</button></div>
</div>

<script>
    // --------------------------------------------------------------
    // БАЗА ВОПРОСОВ (41 теория + 6 задач = 47 шт)

    const allQuestions = [
        // Вопросы 1-41 (Теория)
        { id:1, text:"Фотон поглощается веществом. Что происходит с энергией фотона?", answers:["исчезает","становится составной частью тела","увеличивается","уменьшается"], correct:1, type:"theory" },
        { id:2, text:"Какие из утверждений о свойствах фотона правильны?", answers:["Фотон — частица э/м волны","Фотон в веществе движется медленнее c","Фотон всегда отражается"], correct:0, type:"theory" },
        { id:3, text:"Планк предположил, что атомы любого тела испускают энергию...", answers:["непрерывно","отдельными порциями","атомы не испускают"], correct:1, type:"theory" },
        { id:4, text:"Какие из утверждений о свойствах фотона правильны?", answers:["Всегда поглощается","В веществе скорость < c","Фотон существует только в движении"], correct:2, type:"theory" },
        { id:5, text:"Фотон — это...", answers:["Частица с массой и зарядом","Частица с массой покоя","Частица без массы и заряда, с энергией и импульсом"], correct:2, type:"theory" },
        { id:6, text:"Фотон какого цвета имеет наибольшую энергию?", answers:["Красного","Фиолетового","Одинакова"], correct:1, type:"theory" },
        { id:7, text:"Фотон какого цвета имеет меньшую энергию (оранжевый/синий)?", answers:["Оранжевого","Синего","Одинакова"], correct:0, type:"theory" },
        { id:8, text:"У какого излучения энергия фотона больше?", answers:["Инфракрасного","Ультрафиолетового","Одинакова"], correct:1, type:"theory" },
        { id:9, text:"Массу фотона можно рассчитать по формуле:", answers:["m = hν / c²","m = hν / c","m = hc / λ"], correct:0, type:"theory" },
        { id:10, text:"Энергию кванта можно рассчитать по формуле:", answers:["ε = hν","ε = hcλ","ε = h/ν"], correct:0, type:"theory" },
        { id:11, text:"Почему «хвост» кометы направлен от звезды?", answers:["Гравитация","Электричество","Давление солнечного света","Тепло"], correct:2, type:"theory" },
        { id:12, text:"Образованию «хвостов» комет способствует:", answers:["Химическое действие","Внешний фотоэффект","Давление света"], correct:2, type:"theory" },
        { id:13, text:"Химическое действие света НЕ применяется:", answers:["При фотосинтезе","При фотографировании","При образовании хвоста кометы"], correct:2, type:"theory" },
        { id:14, text:"Коэффициент пропорциональности между энергией кванта и частотой:", answers:["Больцмана","Авогадро","Планка","Фарадея"], correct:2, type:"theory" },
        { id:15, text:"Химическое действие света НЕ применяется (исправлено):", answers:["При фотосинтезе","При фотографировании","При образовании хвоста кометы"], correct:2, type:"theory" },
        { id:16, text:"Что называется внешним фотоэффектом?", answers:["Вырывание e⁻ из металлов под действием облучения","Генерация зарядов в диэлектрике"], correct:0, type:"theory" },
        { id:17, text:"Испускание электронов металлом под действием излучения — это:", answers:["Электролиз","Фотосинтез","Электризация","Фотоэффект"], correct:3, type:"theory" },
        { id:18, text:"Автор квантовой теории света:", answers:["Эйнштейн","Планк","Столетов"], correct:0, type:"theory" },
        { id:19, text:"Незаряженную пластину облучают УФ. Заряд пластины:", answers:["Положительный","Нейтральный","Отрицательный"], correct:0, type:"theory" },
        { id:20, text:"Отрицательно заряженную пластину облучают УФ. Заряд:", answers:["Увеличится","Уменьшится","Не изменится"], correct:1, type:"theory" },
        { id:21, text:"Положительно заряженную пластину облучают УФ. Заряд:", answers:["Станет отрицательным","Станет нейтральным","Останется положительным"], correct:2, type:"theory" },
        { id:22, text:"Первый закон фотоэффекта: фототок насыщения...", answers:["Пропорционален световому потоку","Пропорционален напряжению"], correct:0, type:"theory" },
        { id:23, text:"Уравнение Эйнштейна:", answers:["hν = A + mv²/2","hν = A","hν = mv²/2"], correct:0, type:"theory" },
        { id:24, text:"Красная граница фотоэффекта:", answers:["Зависит от частоты и материала","Зависит только от материала"], correct:1, type:"theory" },
        { id:25, text:"Работа выхода прямо пропорциональна:", answers:["Разности потенциалов","Скорости электрона","Частоте излучения","Красной границе"], correct:3, type:"theory" },
        { id:26, text:"Что определяет разность hν — A?", answers:["Среднюю энергию","Максимальную кинетическую энергию","Максимальную скорость","Красную границу"], correct:1, type:"theory" },
        { id:27, text:"Если уменьшить интенсивность света, фототок насыщения:", answers:["Увеличится","Уменьшится","Не изменится"], correct:1, type:"theory" },
        { id:28, text:"Почему есть красная граница?", answers:["При малой ν энергии кванта недостаточно","При большой ν энергии недостаточно","При малой λ энергии недостаточно","Только под красным светом"], correct:0, type:"theory" },
        { id:29, text:"Красная граница — это:", answers:["Наименьшая длина волны","Наибольшая длина волны","Наибольшая частота"], correct:1, type:"theory" },

        { id:33, text:"При красном есть фотоэффект. Будет ли при голубом?", answers:["Да","Нет","Не знаю"], correct:0, type:"theory" },
        { id:34, text:"Внутренний фотоэффект — это:", answers:["Вырывание e⁻ из металлов","Генерация зарядов в диэлектрике","Генерация зарядов в полупроводнике"], correct:2, type:"theory" },
        { id:35, text:"При каком фотоэффекте нужен больший квант энергии?", answers:["Внешнем","Внутреннем","Одинаков"], correct:0, type:"theory" },
        { id:36, text:"Отличие внешнего от внутреннего:", answers:["Для внутреннего нужна меньшая энергия (большая λ)","Для внутреннего нужна большая энергия (меньшая λ)"], correct:0, type:"theory" },
        { id:37, text:"Фотопроводимость — это:", answers:["Вырывание e⁻","Генерация в диэлектрике","Проводимость полупроводника при освещении"], correct:2, type:"theory" },
        { id:38, text:"Где применяется солнечная батарея?", answers:["Уличное освещение","Подсчет деталей","Хвосты комет","Космические корабли"], correct:3, type:"theory" },
        { id:39, text:"При усилении освещения фоторезистора:", answers:["R↑, I↓","R↓, I↑"], correct:1, type:"theory" },
        { id:40, text:"Фотореле применяют:", answers:["В холодильниках","В нагревателях","Для управления цепями от облучения","Для управления от нагрева"], correct:2, type:"theory" },
        { id:41, text:"Где применяется фотореле?", answers:["Уличное освещение","Фото в темноте","Хвосты комет","Солнечные батареи"], correct:0, type:"theory" },

        // ЗАДАЧИ (6 шт) с графиком и формулами
        { id:42, text:"По графику (синусоида с амплитудой 2В, период 4с) определить параметры. (В ответе укажите номер правильного утверждения)", answers:["ε_max=2В, T=2с, ν=0.5Гц","ε_max=2В, T=4с, ν=0.25Гц","ε_max=4В, T=4с, ν=0.25Гц","ε_max=2В, T=8с, ν=0.125Гц"], correct:1, type:"problem" },
        { id:43, text:"Сила тока i = 2 sin 10πt. Амплитуда тока (А) равна:", answers:["1","2","10","3.14"], correct:1, type:"problem" },

        { id:47, text:"u = 47 sin 2πt. Амплитудное напряжение (В) равно:", answers:["47","2","3.14","94"], correct:0, type:"problem" }
    ];

    let currentSet = [], userAnswers = [], currentIndex = 0, startTime, timerInterval, timePerQuestion = 0, qTimerLeft = 0;

    function toggleTheme() {
        let html = document.documentElement;
        let isDark = html.getAttribute('data-theme') === 'dark';
        html.setAttribute('data-theme', isDark ? '' : 'dark');
        document.getElementById('themeToggle').textContent = isDark ? '🌙' : '☀️';
        localStorage.setItem('theme', isDark ? '' : 'dark');
    }
    (function() { if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeToggle').textContent='☀️'; } })();

    function showScreen(id) { ['selectionScreen','testScreen','resultScreen','referenceScreen'].forEach(s => document.getElementById(s).style.display='none'); document.getElementById(id).style.display='block'; }
    function goHome() { stopTimer(); showScreen('selectionScreen'); }

    function startFullTest() { startTestWithFilter(q => true, "Полный тест"); }
    function startTheoryOnly() { startTestWithFilter(q => q.type === "theory", "Теория (1-41)"); }
    function startProblemsOnly() { startTestWithFilter(q => q.type === "problem", "Задачи (6 шт)"); }

    function startTestWithFilter(filter, name) {
        let filtered = allQuestions.filter(filter);
        if(filtered.length === 0) return;
        currentSet = filtered;
        userAnswers = new Array(currentSet.length).fill(null);
        currentIndex = 0;
        timePerQuestion = parseInt(document.getElementById('timePerQuestion').value) || 0;
        startTime = new Date();
        showScreen('testScreen');
        showQuestion();
    }

    function showQuestion() {
        if(currentIndex >= currentSet.length) { finishTest(); return; }
        let q = currentSet[currentIndex];
        document.getElementById('questionNumber').innerHTML = `Вопрос ${currentIndex+1} из ${currentSet.length}`;
        document.getElementById('originalNumber').innerHTML = `ID: ${q.id} | ${q.type==='theory'?'Теория':'Задача'}`;
        document.getElementById('questionText').innerHTML = q.text;
        document.getElementById('progressFill').style.width = ((currentIndex)/currentSet.length)*100 + '%';
        let container = document.getElementById('answersContainer');
        container.innerHTML = '';
        q.answers.forEach((ans, idx) => {
            let div = document.createElement('div'); div.className = 'answer-option';
            div.innerHTML = `<div class="radio"></div><span>${ans}</span>`;
            if(userAnswers[currentIndex] === idx) div.classList.add('selected');
            div.onclick = () => { selectAnswer(idx); };
            container.appendChild(div);
        });
        document.getElementById('nextBtn').disabled = (userAnswers[currentIndex] === null);
        document.getElementById('nextBtn').innerHTML = (currentIndex === currentSet.length-1) ? '✅ Завершить' : '➡ Далее';
        document.getElementById('prevBtn').disabled = (currentIndex === 0);
        startQuestionTimer();
    }

    function selectAnswer(idx) {
        userAnswers[currentIndex] = idx;
        let opts = document.querySelectorAll('.answer-option');
        opts.forEach((opt, i) => { if(i === idx) opt.classList.add('selected'); else opt.classList.remove('selected'); });
        document.getElementById('nextBtn').disabled = false;
    }

    function startQuestionTimer() {
        stopTimer();
        if(timePerQuestion <= 0) { document.getElementById('timerBar').style.display = 'none'; return; }
        document.getElementById('timerBar').style.display = 'flex';
        qTimerLeft = timePerQuestion;
        updateTimerUI();
        timerInterval = setInterval(() => {
            qTimerLeft -= 0.1;
            if(qTimerLeft <= 0) {
                clearInterval(timerInterval); timerInterval = null;
                if(userAnswers[currentIndex] === null) userAnswers[currentIndex] = -1;
                if(currentIndex < currentSet.length-1) { currentIndex++; showQuestion(); }
                else finishTest();
            } else updateTimerUI();
        }, 100);
    }
    function updateTimerUI() { let percent = (qTimerLeft / timePerQuestion)*100; document.getElementById('timerFill').style.width = Math.max(0,percent)+'%'; document.getElementById('timerText').innerText = Math.ceil(qTimerLeft)+'с'; }
    function stopTimer() { if(timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

    function nextQuestion() { if(userAnswers[currentIndex] === null) return; stopTimer(); if(currentIndex < currentSet.length-1) { currentIndex++; showQuestion(); } else finishTest(); }
    function prevQuestion() { if(currentIndex > 0) { stopTimer(); currentIndex--; showQuestion(); } }

    function finishTest() {
        stopTimer();
        let endTime = new Date();
        let timeSpent = Math.round((endTime - startTime)/1000);
        let correctCount = 0;
        currentSet.forEach((q, i) => { if(userAnswers[i] === q.correct) correctCount++; });
        let percent = Math.round((correctCount/currentSet.length)*100);
        document.getElementById('totalQuestions').innerText = currentSet.length;
        document.getElementById('correctAnswers').innerText = correctCount;
        document.getElementById('percentage').innerText = percent+'%';
        document.getElementById('timeElapsed').innerText = `${Math.floor(timeSpent/60)}:${(timeSpent%60).toString().padStart(2,'0')}`;
        let gradeDiv = document.getElementById('grade');
        let gradeClass = percent>=85?'excellent':(percent>=70?'good':(percent>=50?'satisfactory':'poor'));
        gradeDiv.className = 'grade '+gradeClass;
        gradeDiv.innerHTML = `Оценка: ${percent>=85?'5 Отлично':percent>=70?'4 Хорошо':percent>=50?'3 Удовл.':'2 Неуд.'} | Время: ${Math.floor(timeSpent/60)}:${(timeSpent%60).toString().padStart(2,'0')}`;
        let details = document.getElementById('resultDetails');
        details.innerHTML = '';
        currentSet.forEach((q,i) => {
            let isCor = userAnswers[i] === q.correct;
            let div = document.createElement('div'); div.className = `result-item ${isCor ? 'correct' : 'wrong'}`;
            let userText = (userAnswers[i] === null || userAnswers[i] === -1) ? 'Нет ответа' : q.answers[userAnswers[i]];
            div.innerHTML = `<b>${q.id}</b>. ${isCor ? '✓' : '✗'} Ваш: ${userText} | Верно: ${q.answers[q.correct]}`;
            details.appendChild(div);
        });
        loadLeaderboard();
        showScreen('resultScreen');
    }

    async function loadLeaderboard() {
        let snap = await db.collection('leadersQuantum').orderBy('percent','desc').orderBy('time','asc').limit(10).get();
        let html = '';
        snap.forEach((doc,i) => { let d=doc.data(); html+=`<div>${i+1}. ${d.name} — ${d.percent}% (${d.correct}/${d.total}) ⏱${d.timeStr}</div>`; });
        document.getElementById('leaderboardList').innerHTML = html || 'Пока пусто';
    }
    function saveResult() {
        let name = document.getElementById('leaderName').value.trim();
        if(!name) { alert('Введите имя'); return; }
        let correct = parseInt(document.getElementById('correctAnswers').innerText);
        let total = parseInt(document.getElementById('totalQuestions').innerText);
        let percent = parseInt(document.getElementById('percentage').innerText);
        let timeStr = document.getElementById('timeElapsed').innerText;
        let timeSec = timeStr.split(':').reduce((a,b)=>a*60+parseInt(b),0);
        db.collection('leadersQuantum').add({ name, correct, total, percent, time:timeSec, timeStr }).then(()=>{ document.getElementById('leaderName').value=''; loadLeaderboard(); });
    }
    function retryTest() { userAnswers.fill(null); currentIndex=0; startTime=new Date(); showScreen('testScreen'); showQuestion(); }
    function confirmExit() { if(confirm('Выйти? Прогресс будет потерян')) goHome(); }
    function showReference() {
        showScreen('referenceScreen');
        let container = document.getElementById('referenceContent');
        container.innerHTML = '';
        allQuestions.forEach(q => {
            let div = document.createElement('div'); div.className = 'ref-item';
            div.innerHTML = `<div class="ref-question">${q.id}. ${q.text}</div><div class="ref-answer">✓ ${q.answers[q.correct]}</div>`;
            container.appendChild(div);
        });
    }
    showScreen('selectionScreen');
</script>
</body>
</html>
