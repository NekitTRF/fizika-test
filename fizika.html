<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика — выбор темы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .topics {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .topic-btn {
            display: block;
            padding: 20px;
            border: 2px solid #667eea;
            border-radius: 12px;
            text-decoration: none;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .topic-btn:hover {
            background: #667eea;
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.4);
        }
        .back-btn {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 14px;
            color: #666;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Физика</h1>
        <p class="subtitle">Выберите тему для тестирования</p>
        <div class="topics">
            <a href="test-elektromagnitnye-kolebania.html" class="topic-btn">
                🔄 Электромагнитные колебания. Генератор. Трансформатор
            </a>
            <a href="test-radiosvyaz.html" class="topic-btn">
                📡 Радиосвязь и телевидение
            </a>
            <a href="test-volnovaya-optika.html" class="topic-btn" style="border-color: #48bb78; background: #f0fff4;">
                🌊 Волновая оптика (Интерференция, дифракция, дисперсия)
            </a>
        </div>
        <a href="index.html" class="back-btn">↩ На главную</a>
    </div>
</body>
</html>
