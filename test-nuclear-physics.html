    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f5f7fc;
            --container-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #475569;
            --border: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --secondary: #1e40af;
            --answer-hover: #eff6ff;
            --answer-selected: #dbeafe;
            --progress-bg: #e2e8f0;
            --result-correct: #ecfdf5;
            --result-wrong: #fef2f2;
            --btn-prev: #f1f5f9;
            --btn-prev-hover: #e2e8f0;
            --card-bg: #f8fafc;
            --grade-excellent: #dcfce7;
            --grade-good: #e0f2fe;
            --grade-satisfactory: #fef9c3;
            --grade-poor: #fee2e2;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --shadow: rgba(0, 0, 0, 0.1);
            --timer-bg: #f1f5f9;
            --timer-warning: #f97316;
            --timer-danger: #ef4444;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --container-bg: #1e293b;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #334155;
            --primary: #60a5fa;
            --primary-hover: #3b82f6;
            --secondary: #93c5fd;
            --answer-hover: #1e293b;
            --answer-selected: #2d3a5e;
            --progress-bg: #334155;
            --result-correct: #14532d;
            --result-wrong: #7f1d1d;
            --btn-prev: #334155;
            --btn-prev-hover: #475569;
            --card-bg: #0f172a;
            --grade-excellent: #064e3b;
            --grade-good: #1e3a8a;
            --grade-satisfactory: #854d0e;
            --grade-poor: #7f1d1d;
            --input-bg: #1e293b;
            --input-border: #475569;
            --shadow: rgba(0, 0, 0, 0.5);
            --timer-bg: #1e293b;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--container-bg);
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px var(--shadow);
            max-width: 900px;
            width: 100%;
            padding: 30px;
            transition: all 0.3s;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            border: none;
            background: var(--card-bg);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            z-index: 20;
        }

        h1 { font-size: 26px; margin-bottom: 8px; color: var(--text); text-align: center; }
        .subtitle { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 25px; }

        .settings-panel {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 20px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .settings-panel label { color: var(--text); font-size: 13px; }
        .settings-panel input {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 12px;
            width: 90px;
        }

        .selection-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .topic-btn {
            padding: 20px;
            border: 2px solid var(--primary);
            background: var(--container-bg);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: var(--text);
            text-align: center;
        }
        .topic-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(59,130,246,0.4);
        }
        .topic-btn .range { font-weight: bold; font-size: 18px; display: block; margin-bottom: 5px; }
        .topic-btn .theme { font-size: 12px; color: var(--text-secondary); }
        .topic-btn:hover .theme { color: #e0e0e0; }

        .full-test-btn {
            background: linear-gradient(95deg, var(--primary), var(--secondary));
            border: none;
            padding: 18px;
            border-radius: 24px;
            font-weight: bold;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        .random-btn {
            background: var(--card-bg);
            border: 2px dashed var(--primary);
            padding: 14px;
            border-radius: 24px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        .test-screen, .result-screen, .reference-screen { display: none; }

        .timer-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .timer-progress { flex: 1; height: 8px; background: var(--progress-bg); border-radius: 10px; overflow: hidden; }
        .timer-fill { height: 100%; width: 100%; background: var(--primary); transition: width 0.1s linear; }
        .timer-fill.warning { background: var(--timer-warning); }
        .timer-fill.danger { background: var(--timer-danger); }

        .progress-bar { height: 6px; background: var(--progress-bg); border-radius: 8px; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 8px; transition: width 0.3s; }

        .question-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
        .question { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 20px; line-height: 1.4; }

        .answers { display: flex; flex-direction: column; gap: 10px; }
        .answer-option {
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            color: var(--text);
        }
        .answer-option:hover { border-color: var(--primary); background: var(--answer-hover); }
        .answer-option.selected { border-color: var(--primary); background: var(--answer-selected); }
        .radio, .checkbox {
            width: 22px; height: 22px;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .selected .radio::after { content: ''; width: 10px; height: 10px; background: var(--primary); border-radius: 50%; }
        .checkbox { border-radius: 6px; }
        .selected .checkbox::after { content: '✓'; font-size: 14px; color: white; background: var(--primary); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 4px; }

        .nav-buttons { display: flex; gap: 12px; margin-top: 24px; }
        .nav-btn { padding: 12px 20px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; }
        .prev { background: var(--btn-prev); color: var(--text); }
        .next { background: var(--primary); color: white; flex: 1; }
        .back-btn { margin-top: 15px; width: 100%; padding: 12px; border-radius: 40px; background: var(--card-bg); border: 1px solid var(--border); cursor: pointer; }

        .result-summary { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 25px; }
        .result-card { background: var(--card-bg); padding: 16px; border-radius: 20px; text-align: center; }
        .result-card .number { font-size: 30px; font-weight: 800; color: var(--primary); }

        .grade { text-align: center; font-size: 22px; font-weight: bold; padding: 12px; border-radius: 40px; margin-bottom: 20px; }
        .result-item { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
        .result-item.correct { background: var(--result-correct); border-left: 4px solid #22c55e; }
        .result-item.wrong { background: var(--result-wrong); border-left: 4px solid #ef4444; }

        .reference-content { max-height: 500px; overflow-y: auto; }
        .reference-item { padding: 12px; border-bottom: 1px solid var(--border); }
        .ref-question { font-weight: bold; color: var(--text); }
        .ref-answer { color: #22c55e; padding-left: 12px; }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .selection-buttons { grid-template-columns: 1fr; }
            .result-summary { grid-template-columns: repeat(2,1fr); }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <!-- Выбор темы -->
    <div id="selectionScreen">
        <h1>☢️ Физика атомного ядра</h1>
        <p class="subtitle">Состав ядра, радиоактивность, ядерные реакции, реакторы, детекторы</p>

        <div class="settings-panel">
            <label>⏱ Секунд на вопрос:</label>
            <input type="number" id="timePerQuestion" value="0" min="0" max="300" step="5">
            <span style="font-size:11px">(0 = без таймера)</span>
        </div>

        <div class="selection-buttons">
            <button class="topic-btn" onclick="startTest(1, 12)">
                <span class="range">Вопросы 1-12</span>
                <span class="theme">Состав ядра, нуклоны, изотопы</span>
            </button>
            <button class="topic-btn" onclick="startTest(13, 24)">
                <span class="range">Вопросы 13-24</span>
                <span class="theme">Радиоактивность, α, β, γ-лучи</span>
            </button>
            <button class="topic-btn" onclick="startTest(25, 36)">
                <span class="range">Вопросы 25-36</span>
                <span class="theme">Энергия связи, ядерные реакции, реакторы</span>
            </button>
            <button class="topic-btn" onclick="startTest(37, 47)">
                <span class="range">Вопросы 37-47</span>
                <span class="theme">Детекторы, применение излучений</span>
            </button>
        </div>

        <button class="full-test-btn" onclick="startTest(1, 47)">📋 Полный тест (47 вопросов)</button>
        <button class="random-btn" onclick="startRandomTest()">🎲 Случайные 20 вопросов</button>
        <button class="random-btn" style="border-color:#10b981; margin-top:5px;" onclick="showReference()">📚 Справочник (все ответы)</button>
    </div>

    <!-- Экран теста -->
    <div id="testScreen" class="test-screen">
        <div class="timer-bar" id="timerBar" style="display:none;">
            <span>⏱</span>
            <div class="timer-progress"><div class="timer-fill" id="timerFill"></div></div>
            <span id="timerText">0с</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="question-meta"><span id="questionNumber"></span><span id="originalId"></span></div>
        <div class="question" id="questionText"></div>
        <div class="answers" id="answersContainer"></div>
        <div class="nav-buttons">
            <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()">← Назад</button>
            <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()" disabled>Выберите ответ</button>
        </div>
        <button class="back-btn" onclick="confirmExit()">↩ Вернуться к выбору</button>
    </div>

    <!-- Результаты -->
    <div id="resultScreen" class="result-screen">
        <h2>📊 Результаты теста</h2>
        <div class="result-summary">
            <div class="result-card"><div class="number" id="totalQ">0</div><div>Вопросов</div></div>
            <div class="result-card"><div class="number" id="correctQ">0</div><div>Правильных</div></div>
            <div class="result-card"><div class="number" id="percentQ">0%</div><div>Процент</div></div>
            <div class="result-card"><div class="number" id="timeSpent">0:00</div><div>Время</div></div>
        </div>
        <div class="grade" id="gradeLabel"></div>
        <div id="resultDetails" style="max-height: 260px; overflow-y: auto; margin-bottom: 20px;"></div>
        <div style="background: var(--card-bg); border-radius: 20px; padding: 16px; margin-bottom: 20px;">
            <h3 style="text-align:center">🏆 Топ-10 (Физика ядра)</h3>
            <div id="leaderboardList" style="max-height:180px; overflow-y:auto;"></div>
            <div style="display:flex; gap:10px; margin-top:12px;">
                <input type="text" id="leaderName" placeholder="Ваше имя" style="flex:1; background:var(--input-bg); border:1px solid var(--input-border); border-radius:40px; padding:8px 15px;">
                <button onclick="saveLeaderboard()" style="background:var(--primary); border:none; border-radius:40px; padding:8px 18px; color:white;">💾 Сохранить</button>
            </div>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="nav-btn" onclick="retryTest()" style="background:var(--primary);">🔄 Пройти заново</button>
            <button class="nav-btn" onclick="shareResult()" style="background:#25D366; color:white;">📤 Поделиться</button>
            <button class="nav-btn" onclick="showReference()" style="background:var(--card-bg);">📖 Справочник</button>
            <button class="nav-btn" onclick="goToSelection()" style="background:var(--btn-prev);">🏠 К выбору</button>
        </div>
    </div>

    <!-- Справочник -->
    <div id="referenceScreen" class="reference-screen">
        <h2>📖 Справочник — все ответы</h2>
        <div id="referenceContent" class="reference-content"></div>
        <button class="back-btn" style="margin-top:20px;" onclick="goToSelection()">↩ На главную</button>
    </div>
</div>

<script>
    // ---------- БАНК ВОПРОСОВ (47 штук) ----------
    const questionsBank = [
        { id:1, text:"Ядро атома состоит из …", answers:["протонов и электронов","нейтронов и электронов","протонов и нейтронов","только протонов"], correct:2 },
        { id:2, text:"Укажите элементарную частицу, которая не является нуклоном: (может быть более одного)", answers:["Протон","Нейтрон","Электрон","Позитрон"], multi:true, correct:[2,3] },
        { id:3, text:"Кто из учёных впервые открыл электрон, протон, нейтрон?", answers:["Томсон, Резерфорд, Чедвик","Резерфорд, Томсон, Бор","Чедвик, Резерфорд, Томсон","Бор, Резерфорд, Чедвик"], correct:0 },
        { id:4, text:"Укажите массовое и зарядовое число протона и нейтрона", answers:["p: A=1,Z=1 ; n: A=1,Z=0","p: A=0,Z=1 ; n: A=1,Z=1","p: A=1,Z=0 ; n: A=1,Z=1"], correct:0 },
        { id:5, text:"Массовое число ядра -", answers:["число протонов","число нейтронов","сумма протонов и нейтронов","число электронов"], correct:2 },
        { id:6, text:"Каков знак заряда ядра?", answers:["отрицательный","положительный","нейтральный","зависит от изотопа"], correct:1 },
        { id:7, text:"Каких частиц в атоме равное число?", answers:["протонов и нейтронов","электронов и нейтронов","протонов и электронов","всех одинаково"], correct:2 },
        { id:8, text:"Укажите элементарную частицу, которая не является нуклоном:", answers:["Протон","Нейтрон","Электрон"], multi:true, correct:[2] },
        { id:9, text:"Сколько протонов в атоме нейтрального атома с числом электронов 5 и числом нейтронов 7", answers:["5","7","12","2"], correct:0 },
        { id:10, text:"Сколько электронов в оболочке нейтрального атома, если в ядре 21 протон и 23 нейтрона?", answers:["21","23","44","2"], correct:0 },
        { id:11, text:"Ядра, имеющие одинаковые зарядовые, но разные массовые числа, называются…", answers:["изобарами","изотопами","изотонами","нуклидами"], correct:1 },
        { id:12, text:"Изотопы, имеющие одинаковые химические свойства, различаются между собой …", answers:["числом протонов","числом нейтронов","числом электронов","зарядом ядра"], correct:1 },
        { id:13, text:"α - лучи представляют собой …", answers:["поток электронов","поток ядер гелия","электромагнитные волны","поток протонов"], correct:1 },
        { id:14, text:"Масса α – частицы равна …", answers:["массе электрона","массе протона","4 а.е.м.","1 а.е.м."], correct:2 },
        { id:15, text:"β - лучи представляют собой …", answers:["поток ядер гелия","поток электронов","поток фотонов","поток нейтронов"], correct:1 },
        { id:16, text:"Какое из трех типов излучений не отклоняется магнитными и электрическими полями?", answers:["α","β","γ","все отклоняются"], correct:2 },
        { id:17, text:"Сколько протонов Z и нейтронов N в ядре изотопа алюминия ²⁷Al?", answers:["Z=13,N=14","Z=14,N=13","Z=27,N=13","Z=13,N=27"], correct:0 },
        { id:18, text:"Какую природу имеют ядерные силы?", answers:["электромагнитную","гравитационную","сильное взаимодействие","слабое взаимодействие"], correct:2 },
        { id:19, text:"В ядре два нуклона постоянно обмениваются третьей частицей, которая называется:", answers:["глюон","пион (мезон)","фотон","бозон Хиггса"], correct:1 },
        { id:22, text:"Кто из учёных впервые открыл явление радиоактивности?", answers:["Кюри","Резерфорд","Беккерель","Томсон"], correct:2 },
        { id:23, text:"Как изменится масса ядра из одного свободного протона и двух нейтронов после разделения ядра на нуклоны?", answers:["увеличится","уменьшится","не изменится"], correct:0 },
        { id:24, text:"Как изменится масса системы после соединения протона и нейтрона в ядро?", answers:["увеличится","уменьшится","не изменится"], correct:1 },
        { id:25, text:"При термоядерном синтезе происходит", answers:["деление тяжелых ядер","выделение энергии","поглощение энергии","образование нейтронов"], correct:1 },
        { id:26, text:"Энергия, которая выделяется при соединении нуклонов в ядро называется…", answers:["кинетической","энергией связи","потенциальной","энергией активации"], correct:1 },
        { id:27, text:"Энергия, затраченная при разделении ядра на нуклоны…", answers:["равна энергии связи","больше энергии связи","меньше энергии связи","не связана"], correct:0 },
        { id:28, text:"В недрах звезд происходит выделение энергии за счет", answers:["деления урана","термоядерного синтеза","радиоактивного распада","химических реакций"], correct:1 },
        { id:29, text:"При делении ядер выделяется энергия. Она называется", answers:["химическая","ядерная","энергия связи","энергия ионизации"], correct:1 },
        { id:30, text:"Какой вид радиоактивного излучения наиболее опасен при внешнем облучении человека?", answers:["α","β","γ","все одинаково"], correct:2 },
        { id:31, text:"Частицы, при обстреле которыми природного урана, в руде обнаружили барий", answers:["протоны","нейтроны","электроны","α-частицы"], correct:1 },
        { id:32, text:"Ядерный реактор — устройство для осуществления …", answers:["термоядерной реакции","управляемой цепной реакции","неуправляемой реакции","радиоактивного распада"], correct:1 },
        { id:33, text:"Силы притяжения между нуклонами в ядре называются …", answers:["кулоновскими","ядерными","гравитационными","магнитными"], correct:1 },
        { id:34, text:"Какие вещества используют в ядерных реакторах как замедлители нейтронов? (несколько)", answers:["Графит","Вода","Бериллий","Кадмий"], multi:true, correct:[0,1,2] },
        { id:35, text:"Регулирующие стержни в ядерном реакторе", answers:["поглощают нейтроны","отражают нейтроны","ускоряют нейтроны","замедляют нейтроны"], correct:0 },
        { id:36, text:"В ядерном реакторе атомной электростанции применяется", answers:["обогащенный уран","плутоний","торий","природный уран"], correct:0 },
        { id:37, text:"Для стерилизации инструментов применяется характеристика радиоактивных излучений", answers:["ионизирующая способность","проникающая способность","тепловое действие"], correct:1 },
        { id:38, text:"Для обработки семян зерновых культур против вредителей применяется", answers:["γ-облучение","α-облучение","β-облучение","нейтронное"], correct:0 },
        { id:39, text:"Внутренние дефекты изделий определяют с помощью", answers:["α-излучения","β-излучения","γ-дефектоскопии","магнитного поля"], correct:2 },
        { id:40, text:"Радиоактивные изотопы применяют", answers:["в медицине","в промышленности","в археологии","во всех перечисленных"], correct:3 },
        { id:41, text:"Укажите элементарную частицу, которая нестабильна и быстро распадается", answers:["протон","нейтрон","электрон","нейтрино"], correct:1 },
        { id:42, text:"В каком приборе для изучения треков получают фотографии треков?", answers:["камера Вильсона","пузырьковая камера","счетчик Гейгера","фотопластинка"], correct:0 },
        { id:43, text:"В каком приборе прохождение частицы вызывает цепочку пузырьков пара в жидкости?", answers:["камера Вильсона","пузырьковая камера","искровая камера","сцинтиллятор"], correct:1 },
        { id:44, text:"В каком приборе прохождение частицы вызывает след из пузырьков в насыщенном паре?", answers:["камера Вильсона","пузырьковая камера","эмульсия"], correct:1 },
        { id:45, text:"По таблице Менделеева число протонов в ядре атома бора (B) равно", answers:["5","6","10","11"], correct:0 },
        { id:46, text:"Массовое число химического элемента цезия (Cs) приблизительно равно", answers:["55","133","79","23"], correct:1 },
        { id:47, text:"Число нейтронов в ядре атома цезия ¹³³Cs равно", answers:["55","78","133","88"], correct:1 }
    ];
    // преобразуем все вопросы к единому формату (multi false по умолчанию)
    for(let q of questionsBank) if(q.multi===undefined) q.multi=false;

    let currentQuestions = [];
    let currentIndex = 0;
    let userAnswers = [];
    let timePerSec = 0;
    let timerInterval = null;
    let timeLeft = 0;
    let testStart = null;

    function toggleTheme() {
        let theme = document.documentElement.getAttribute('data-theme') === 'dark' ? '' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        document.getElementById('themeToggle').innerText = theme === 'dark' ? '☀️' : '🌙';
    }
    (function(){ if(localStorage.getItem('theme')==='dark') toggleTheme(); })();

    function showScreen(id) { ['selectionScreen','testScreen','resultScreen','referenceScreen'].forEach(s=>document.getElementById(s).style.display='none'); document.getElementById(id).style.display='block'; }
    function goToSelection() { stopTimer(); showScreen('selectionScreen'); }
    function confirmExit() { if(confirm('Выйти? Неотвеченные вопросы потеряются')) { stopTimer(); goToSelection(); } }

    function startTest(startId,endId) { let filtered = questionsBank.filter(q=>q.id>=startId && q.id<=endId); if(!filtered.length) return; currentQuestions = [...filtered]; initTestSession(); }
    function startRandomTest() { let shuffled = [...questionsBank].sort(()=>0.5-Math.random()); currentQuestions = shuffled.slice(0,20); initTestSession(); }
    function initTestSession() { currentIndex=0; userAnswers = new Array(currentQuestions.length).fill(null); timePerSec = parseInt(document.getElementById('timePerQuestion').value)||0; testStart = new Date(); showScreen('testScreen'); renderQuestion(); }

    function stopTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval=null; }
    function startQuestionTimer() {
        stopTimer();
        if(timePerSec<=0) { document.getElementById('timerBar').style.display='none'; return; }
        document.getElementById('timerBar').style.display='flex';
        timeLeft = timePerSec;
        updateTimerUI();
        timerInterval = setInterval(()=>{ timeLeft-=0.1; if(timeLeft<=0){ timeLeft=0; stopTimer(); if(userAnswers[currentIndex]===null) userAnswers[currentIndex]=-1; if(currentIndex<currentQuestions.length-1){ currentIndex++; renderQuestion(); } else finishTest(); } updateTimerUI(); },100);
    }
    function updateTimerUI() { let sec=Math.ceil(timeLeft); let percent=(timeLeft/timePerSec)*100; let fill=document.getElementById('timerFill'); fill.style.width=Math.max(0,percent)+'%'; fill.classList.remove('warning','danger'); if(percent<=25) fill.classList.add('danger'); else if(percent<=50) fill.classList.add('warning'); document.getElementById('timerText').innerText=sec+'с'; }

    function renderQuestion() {
        if(currentIndex>=currentQuestions.length) { finishTest(); return; }
        let q = currentQuestions[currentIndex];
        document.getElementById('questionNumber').innerText = `Вопрос ${currentIndex+1}/${currentQuestions.length}`;
        document.getElementById('originalId').innerText = `№${q.id}`;
        document.getElementById('questionText').innerText = q.text;
        let progress = ((currentIndex)/currentQuestions.length)*100;
        document.getElementById('progressFill').style.width=progress+'%';
        let container = document.getElementById('answersContainer');
        container.innerHTML='';
        q.answers.forEach((ans,idx)=>{
            let div = document.createElement('div'); div.className='answer-option';
            let isMulti = q.multi;
            div.innerHTML = `<div class="${isMulti ? 'checkbox' : 'radio'}"></div><span>${ans}</span>`;
            if(isMulti){
                let arr = userAnswers[currentIndex] || [];
                if(Array.isArray(arr) && arr.includes(idx)) div.classList.add('selected');
                div.onclick = ()=>{
                    if(!userAnswers[currentIndex]) userAnswers[currentIndex]=[];
                    let arr2 = userAnswers[currentIndex];
                    let pos = arr2.indexOf(idx);
                    if(pos>=0) arr2.splice(pos,1); else arr2.push(idx);
                    div.classList.toggle('selected');
                    document.getElementById('nextBtn').disabled = (userAnswers[currentIndex].length===0);
                };
            } else {
                if(userAnswers[currentIndex]===idx) div.classList.add('selected');
                div.onclick = ()=>{
                    userAnswers[currentIndex]=idx;
                    document.querySelectorAll('.answer-option').forEach((opt,i)=>opt.classList.toggle('selected',i===idx));
                    document.getElementById('nextBtn').disabled=false;
                };
            }
            container.appendChild(div);
        });
        document.getElementById('nextBtn').disabled = (q.multi ? (!userAnswers[currentIndex] || userAnswers[currentIndex].length===0) : (userAnswers[currentIndex]===null));
        document.getElementById('nextBtn').innerText = currentIndex===currentQuestions.length-1 ? 'Завершить' : 'Вперед →';
        document.getElementById('prevBtn').disabled = (currentIndex===0);
        startQuestionTimer();
    }

    function nextQuestion() { if(userAnswers[currentIndex]===null || (Array.isArray(userAnswers[currentIndex]) && userAnswers[currentIndex].length===0)) return; stopTimer(); if(currentIndex<currentQuestions.length-1){ currentIndex++; renderQuestion(); } else { finishTest(); } }
    function prevQuestion() { if(currentIndex>0){ stopTimer(); currentIndex--; renderQuestion(); } }

    function finishTest() { stopTimer(); let end = new Date(); let totalSec = Math.round((end-testStart)/1000); showScreen('resultScreen');
        let correct=0; currentQuestions.forEach((q,i)=>{ let u=userAnswers[i]; if(u===null || u===-1) return; if(q.multi){ let corr = q.correct.slice().sort().join(','); let given = (Array.isArray(u)?u.slice().sort():[]).join(','); if(corr===given) correct++; } else { if(u===q.correct) correct++; } });
        let total=currentQuestions.length; let percent = Math.round(correct/total*100);
        document.getElementById('totalQ').innerText=total; document.getElementById('correctQ').innerText=correct; document.getElementById('percentQ').innerText=percent+'%'; document.getElementById('timeSpent').innerText=`${Math.floor(totalSec/60)}:${(totalSec%60).toString().padStart(2,'0')}`;
        let grade='', cls=''; if(percent>=85){ grade='5 (Отлично)'; cls='excellent'; } else if(percent>=70){ grade='4 (Хорошо)'; cls='good'; } else if(percent>=50){ grade='3 (Удовл.)'; cls='satisfactory'; } else { grade='2 (Неуд.)'; cls='poor'; }
        let gradeDiv=document.getElementById('gradeLabel'); gradeDiv.innerText=`Оценка: ${grade}`; gradeDiv.className=`grade ${cls}`;
        let detailsDiv=document.getElementById('resultDetails'); detailsDiv.innerHTML='';
        [...currentQuestions].sort((a,b)=>a.id-b.id).forEach(q=>{
            let idx = currentQuestions.findIndex(qq=>qq.id===q.id);
            let u = userAnswers[idx]; let isCor = false;
            if(q.multi){ let corr = q.correct.slice().sort().join(','); let given = (Array.isArray(u)?u.slice().sort():[]).join(','); isCor = corr===given; }
            else { isCor = u===q.correct; }
            let div=document.createElement('div'); div.className=`result-item ${isCor?'correct':'wrong'}`;
            let text = `${q.id}. ${isCor?'✓':'✗'} `;
            if(u!==null && u!==-1){
                if(q.multi) text+=`Ваш выбор: ${(Array.isArray(u)?u.map(i=>q.answers[i]).join(', '):'нет')}`;
                else text+=`Ваш ответ: ${q.answers[u]}`;
            } else text+='Нет ответа';
            if(!isCor) text+=` | Правильно: ${q.multi? q.correct.map(i=>q.answers[i]).join(', ') : q.answers[q.correct]}`;
            div.innerText=text; detailsDiv.appendChild(div);
        });
        loadLeaderboard();
    }

    async function loadLeaderboard() { let listDiv=document.getElementById('leaderboardList'); listDiv.innerHTML='Загрузка...'; try{ let snap=await db.collection('leadersNuclear').orderBy('percent','desc').orderBy('time','asc').limit(10).get(); let items=[]; snap.forEach(d=>items.push(d.data())); listDiv.innerHTML=items.map((e,i)=>{ let medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`; return `<div style="padding:4px 0; border-bottom:1px solid var(--border);">${medal} ${e.name} — ${e.percent}% (${e.correct}/${e.total}) ⏱${e.timeStr}</div>`; }).join(''); if(!items.length) listDiv.innerHTML='Пока нет результатов. Стань первым!'; } catch(e){ listDiv.innerHTML='Ошибка загрузки'; } }
    function saveLeaderboard(){ let name=document.getElementById('leaderName').value.trim(); if(!name){ alert('Введите имя'); return; } let correct=parseInt(document.getElementById('correctQ').innerText); let total=parseInt(document.getElementById('totalQ').innerText); let percent=parseInt(document.getElementById('percentQ').innerText); let timeStr=document.getElementById('timeSpent').innerText; let parts=timeStr.split(':'); let timeSec=parseInt(parts[0])*60+parseInt(parts[1]); db.collection('leadersNuclear').add({name, correct, total, percent, time:timeSec, timeStr}).then(()=>{ document.getElementById('leaderName').value=''; loadLeaderboard(); }).catch(e=>alert('Ошибка: '+e.message)); }
    function shareResult(){ let correct=document.getElementById('correctQ').innerText; let total=document.getElementById('totalQ').innerText; let percent=document.getElementById('percentQ').innerText; let time=document.getElementById('timeSpent').innerText; let text=`☢️ Физика ядра\n✅ ${correct}/${total} (${percent})\n⏱ ${time}\nПройди тест: https://nekittrf.github.io/fizika-test/`; if(navigator.share) navigator.share({title:'Результат', text}); else navigator.clipboard.writeText(text).then(()=>alert('Скопировано!')); }
    function retryTest() { stopTimer(); initTestSession(); }
    function showReference() { let refDiv=document.getElementById('referenceContent'); refDiv.innerHTML=''; questionsBank.forEach(q=>{ let div=document.createElement('div'); div.className='reference-item'; let correctAns = q.multi ? q.correct.map(i=>q.answers[i]).join(', ') : q.answers[q.correct]; div.innerHTML=`<div class="ref-question">${q.id}. ${q.text}</div><div class="ref-answer">✓ ${correctAns}</div>`; refDiv.appendChild(div); }); showScreen('referenceScreen'); }
    window.startTest=startTest; window.startRandomTest=startRandomTest; window.showReference=showReference; window.nextQuestion=nextQuestion; window.prevQuestion=prevQuestion; window.confirmExit=confirmExit; window.goToSelection=goToSelection; window.retryTest=retryTest; window.saveLeaderboard=saveLeaderboard; window.shareResult=shareResult;
    showScreen('selectionScreen');
</script>
</body>
</html>
