    <style>
        :root {
            --bg: #f5f5f5;
            --container-bg: #ffffff;
            --text: #333333;
            --text-secondary: #666666;
            --border: #e0e0e0;
            --primary: #667eea;
            --primary-hover: #5a6fd6;
            --secondary: #764ba2;
            --answer-hover: #f8f9ff;

            --progress-bg: #e0e0e0;
            --result-correct: #f1f8e9;
            --result-wrong: #fff5f5;
            --btn-prev: #f0f0f0;
            --btn-prev-hover: #e0e0e0;
            --card-bg: #f8f9ff;
            --grade-excellent: #e8f5e9;
            --grade-good: #e3f2fd;
            --grade-satisfactory: #fff3e0;
            --grade-poor: #ffebee;
            --input-bg: #ffffff;
            --input-border: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.1);
            --timer-bg: #f0f0f0;
            --timer-warning: #ff9800;
            --timer-danger: #f44336;
        }

        [data-theme="dark"] {
            --bg: #1a1a2e;
            --container-bg: #16213e;
            --text: #e0e0e0;
            --text-secondary: #aaaaaa;
            --border: #2a2a4a;
            --primary: #7c8cf8;
            --primary-hover: #6a7ae0;
            --secondary: #9b7bc4;
            --answer-hover: #1e2a45;
            --answer-selected: #243050;
            --progress-bg: #2a2a4a;
            --result-correct: #1a2e1a;
            --result-wrong: #2e1a1a;
            --btn-prev: #2a2a4a;
            --btn-prev-hover: #3a3a5a;
            --card-bg: #1e2a45;
            --grade-excellent: #1a2e1a;
            --grade-good: #1a2040;
            --grade-satisfactory: #2e201a;
            --grade-poor: #2e1a1a;
            --input-bg: #1e2a45;
            --input-border: #3a3a5a;
            --shadow: rgba(0, 0, 0, 0.5);

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);

            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s;

        .container {
            background: var(--container-bg);
            border-radius: 20px;
            box-shadow: 0 20px 60px var(--shadow);
            max-width: 850px;
            width: 100%;
            padding: 30px;
            animation: fadeIn 0.5s ease;
            transition: background 0.3s, box-shadow 0.3s;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .theme-toggle {
            position: absolute;
            top: 15px; right: 15px;
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 20px;
            background: var(--card-bg);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .theme-toggle:hover { transform: scale(1.1); }

        .selection-screen h1 {
            text-align: center;
            color: var(--text);
            margin-bottom: 10px;
            font-size: 22px;
        }
        .selection-screen .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 14px;
        }
        .selection-screen .info {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 16px;
            font-weight: bold;
        }

        .settings-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }
        .settings-panel label { color: var(--text); font-size: 13px; }
        .settings-panel input, .settings-panel select {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            width: 80px;
            transition: all 0.3s;
        }

        .selection-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .topic-btn {
            padding: 20px;
            border: 2px solid var(--primary);
            background: var(--container-bg);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            color: var(--text);
        }
        .topic-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .topic-btn .range { font-weight: bold; font-size: 18px; display: block; margin-bottom: 5px; }
        .topic-btn .theme { font-size: 12px; color: var(--text-secondary); }
        .topic-btn:hover .theme { color: #e0e0e0; }

        .full-test-btn {
            margin-top: 20px;
            padding: 18px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            width: 100%;
        }
        .full-test-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(118, 75, 162, 0.5); }

        .random-btn {
            margin-top: 10px;
            padding: 14px;
            border: 2px dashed var(--primary);
            background: var(--card-bg);
            color: var(--primary);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            width: 100%;
        }
        .random-btn:hover { background: var(--primary); color: white; }

        .test-screen { display: none; }
        .timer-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .timer-bar .timer-icon { font-size: 20px; }
        .timer-bar .timer-progress { flex: 1; height: 8px; background: var(--progress-bg); border-radius: 4px; overflow: hidden; }
        .timer-bar .timer-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width 0.1s linear, background 0.5s; }
        .timer-bar .timer-fill.warning { background: var(--timer-warning); }
        .timer-bar .timer-fill.danger { background: var(--timer-danger); animation: pulse 0.5s infinite; }
        .timer-bar .timer-text { font-size: 14px; font-weight: bold; color: var(--text); min-width: 40px; text-align: center; }

        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

        .test-screen .progress-bar { height: 6px; background: var(--progress-bg); border-radius: 3px; margin-bottom: 20px; }
        .test-screen .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 3px; transition: width 0.3s; }
        .test-screen .question-meta { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--text-secondary); font-size: 13px; }
        .test-screen .question { font-size: 16px; font-weight: bold; color: var(--text); margin-bottom: 20px; line-height: 1.5; }

        .answers { display: flex; flex-direction: column; gap: 10px; }
        .answer-option {
            padding: 15px 20px;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
        }
        .answer-option:hover { border-color: var(--primary); background: var(--answer-hover); }
        .answer-option.selected { border-color: var(--primary); background: var(--answer-selected); }
        .answer-option .radio {
            width: 20px; height: 20px;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .answer-option.selected .radio { border-color: var(--primary); }
        .answer-option.selected .radio::after { content: ''; width: 10px; height: 10px; background: var(--primary); border-radius: 50%; }

        .nav-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .nav-btn { padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .nav-btn.prev { background: var(--btn-prev); color: var(--text); }
        .nav-btn.prev:hover { background: var(--btn-prev-hover); }
        .nav-btn.next { background: var(--primary); color: white; flex: 1; }
        .nav-btn.next:hover { background: var(--primary-hover); }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .back-btn {
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: var(--container-bg);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
            transition: all 0.3s;
            width: 100%;
        }
        .back-btn:hover { background: var(--card-bg); }

        .result-screen { display: none; }
        .result-screen h2 { text-align: center; color: var(--text); margin-bottom: 20px; }
        .result-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .result-card { background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; }
        .result-card .number { font-size: 28px; font-weight: bold; color: var(--primary); }
        .result-card .label { font-size: 11px; color: var(--text-secondary); margin-top: 5px; }

        .grade { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; padding: 15px; border-radius: 12px; }
        .grade.excellent { background: var(--grade-excellent); color: #2e7d32; }
        .grade.good { background: var(--grade-good); color: #1565c0; }
        .grade.satisfactory { background: var(--grade-satisfactory); color: #e65100; }
        .grade.poor { background: var(--grade-poor); color: #c62828; }
        [data-theme="dark"] .grade.excellent { color: #66bb6a; }
        [data-theme="dark"] .grade.good { color: #64b5f6; }
        [data-theme="dark"] .grade.satisfactory { color: #ffb74d; }
        [data-theme="dark"] .grade.poor { color: #ef5350; }

        .result-details { max-height: 300px; overflow-y: auto; margin-bottom: 20px; padding-right: 10px; }
        .result-item { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text); }
        .result-item.correct { background: var(--result-correct); border-left: 3px solid #4caf50; }
        .result-item.wrong { background: var(--result-wrong); border-left: 3px solid #f44336; }

        .result-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .result-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.3s; min-width: 120px; }
        .btn-retry { background: var(--primary); color: white; }
        .btn-reference { background: #fff3e0; color: #e65100; }
        .btn-home { background: var(--btn-prev); color: var(--text); }

        .reference-screen { display: none; }
        .reference-screen h2 { text-align: center; margin-bottom: 20px; color: var(--text); }
        .reference-content { max-height: 500px; overflow-y: auto; padding-right: 10px; }
        .reference-item { padding: 12px; border-bottom: 1px solid var(--border); }
        .reference-item .ref-question { font-weight: bold; margin-bottom: 5px; color: var(--text); }
        .reference-item .ref-answer { color: #4caf50; padding-left: 10px; border-left: 3px solid #4caf50; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--progress-bg); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .selection-buttons { grid-template-columns: 1fr; }
            .result-summary { grid-template-columns: repeat(2, 1fr); }
            .nav-buttons { flex-direction: column; }
            .settings-panel { flex-direction: column; align-items: stretch; }
            .settings-panel input, .settings-panel select { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Тёмный/светлый режим">🌙</button>

        <div class="selection-screen" id="selectionScreen">
            <h1>🌊 Волновая оптика</h1>
            <p class="subtitle">Интерференция, дифракция, дисперсия, поляризация, спектры</p>

            <div class="settings-panel">
                <label>⏱ Секунд на вопрос:</label>
                <input type="number" id="timePerQuestion" value="0" min="0" max="300" step="5">
                <span style="font-size:11px;color:var(--text-secondary)">(0 = без таймера)</span>
            </div>

            <p class="info">Выберите раздел теста</p>

            <div class="selection-buttons">
                <button class="topic-btn" onclick="startTest(1, 16)">
                    <span class="range">Вопросы 1-16</span>
                    <span class="theme">Основы волновой оптики, скорость света, законы</span>
                </button>
                <button class="topic-btn" onclick="startTest(17, 32)">
                    <span class="range">Вопросы 17-32</span>
                    <span class="theme">Цвет, дисперсия, интерференция, дифракция</span>
                </button>
                <button class="topic-btn" onclick="startTest(33, 48)">
                    <span class="range">Вопросы 33-48</span>
                    <span class="theme">Спектры, излучения, применение</span>
                </button>
            </div>

            <button class="full-test-btn" onclick="startTest(1, 48)">
                📋 Полный тест (48 вопросов)
            </button>

            <button class="random-btn" onclick="startRandomTest()">
                🎲 Случайные вопросы (20 шт)
            </button>

            <button class="random-btn" style="margin-top:5px; border-color:#4caf50; color:#4caf50;" onclick="showReference()">
                📖 Справочник (все ответы)
            </button>
        </div>

        <div class="test-screen" id="testScreen">
            <div class="timer-bar" id="timerBar" style="display:none;">
                <span class="timer-icon">⏱</span>
                <div class="timer-progress"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
                <span class="timer-text" id="timerText">0</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
            <div class="question-meta">
                <span id="questionNumber"></span>
                <span id="originalNumber"></span>
            </div>
            <div class="question" id="questionText"></div>
            <div class="answers" id="answersContainer"></div>
            <div class="nav-buttons">
                <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()">← Назад</button>
                <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()" disabled>Выберите ответ</button>
            </div>
            <button class="back-btn" onclick="confirmExitTest()">↩ Вернуться к выбору</button>
        </div>

        <div class="result-screen" id="resultScreen">
            <h2>Результаты теста</h2>
            <div class="result-summary">
                <div class="result-card"><div class="number" id="totalQuestions">0</div><div class="label">Вопросов</div></div>
                <div class="result-card"><div class="number" id="correctAnswers">0</div><div class="label">Правильных</div></div>
                <div class="result-card"><div class="number" id="percentage">0%</div><div class="label">Процент</div></div>
                <div class="result-card"><div class="number" id="timeElapsed">0:00</div><div class="label">Затрачено</div></div>
            </div>
            <div class="grade" id="grade"></div>
            <div class="result-details" id="resultDetails"></div>
            <div style="background:var(--card-bg); border-radius:12px; padding:15px; margin-bottom:20px;">
                <h3 style="text-align:center; color:var(--text); margin-bottom:10px;">🏆 Топ-10 (мировой рейтинг)</h3>
                <div id="leaderboardList" style="max-height:200px; overflow-y:auto;"></div>
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="text" id="leaderName" placeholder="Твоё имя" style="flex:1; background:var(--input-bg); border:1px solid var(--input-border); color:var(--text); padding:8px 12px; border-radius:8px;">
                    <button onclick="addToLeaderboard()" style="background:var(--primary); color:white; border:none; padding:8px 16px; border-radius:8px; cursor:pointer;">💾 Сохранить</button>
                </div>
            </div>
            <div class="result-buttons">
                <button class="btn-retry" onclick="retryTest()">🔄 Пройти заново</button>
                <button class="btn-reference" onclick="showReference()">📖 Справочник</button>
                <button class="btn-home" onclick="goToSelection()">🏠 На главную</button>
            </div>
        </div>

        <div class="reference-screen" id="referenceScreen">
            <h2>📖 Справочник - Все ответы (Волновая оптика)</h2>
            <div class="reference-content" id="referenceContent"></div>
            <button class="back-btn" style="margin-top:15px; width:100%;" onclick="goToSelection()">↩ На главную</button>
        </div>
    </div>

    <script>
        // Все вопросы из документа (48 вопросов)
        const allQuestions = [
            { id: 1, question: "Укажите среду, где скорость света наибольшая", answers: ["Газ", "Жидкость", "Твердое тело", "Вакуум"], correct: 3 },
            { id: 2, question: "Планк в своей теории утверждал, что свет — это", answers: ["Механическая волна", "Электромагнитная волна", "Поток фотонов"], correct: 2 },
            { id: 3, question: "Свет является электромагнитной волной - утверждал в своей теории...", answers: ["Ньютон", "Гюйгенс", "Лоренц", "Максвелл", "Планк"], correct: 3 },
            { id: 4, question: "Силой света называют", answers: ["Часть пространства, вырезанную конической поверхностью", "Отношение светового потока к величине телесного угла", "Отношение потока излучения к величине телесного угла", "Отношение светового потока к величине площади освещаемой поверхности"], correct: 1 },
            { id: 5, question: "Световой поток", answers: ["Измеряется энергией излучения в единицу времени", "Это часть потока излучения, вызывающая у человека световое ощущение", "Это часть пространства, ограниченная конической поверхностью"], correct: 1 },
            { id: 6, question: "Отношение светового потока к площади освещенности поверхности при перпендикулярном распространении лучей называют", answers: ["Световым потоком", "Силой света", "Телесным углом", "Потоком излучения", "Освещенностью"], correct: 4 },
            { id: 7, question: "Закон отражения света", answers: ["Падающий луч, луч отраженный и нормаль лежат в одной плоскости", "Все точки фронта волны являются источниками элементарных волн", "Падающий луч, отраженный, преломленный и нормаль лежат в одной плоскости", "Свет имеет волновую природу"], correct: 0 },
            { id: 8, question: "Прибор для измерения светового потока", answers: ["Фотоэкспонометр", "Фотометр", "Спектрограф"], correct: 1 },
            { id: 9, question: "Люксметр — прибор для измерения", answers: ["Светового потока", "Освещенности", "Силы света", "Телесного угла"], correct: 1 },
            { id: 10, question: "Угол падения луча света на зеркальную поверхность равен 30°. Каков угол между отраженным лучом и зеркальной поверхностью?", answers: ["60°", "80°", "30°", "40°", "90°"], correct: 0 },
            { id: 11, question: "Между падающим и отраженным лучами угол 50°. Чему равен угол отражения?", answers: ["25°", "50°", "100°", "130°"], correct: 0 },
            { id: 12, question: "При распространении света из воздуха в стекло", answers: ["Скорость света в стекле больше, чем в воздухе", "Стекло является оптически более плотной средой", "Угол падения меньше угла преломления", "Можно наблюдать полное отражение", "Относительный показатель стекла меньше 1"], correct: 1 },
            { id: 13, question: "Полное отражение света можно наблюдать при переходе световых лучей", answers: ["Из воды в воздух", "Из воздуха в воду", "Из воздуха в стекло"], correct: 0 },

            { id: 47, question: "Парниковый эффект у поверхности Земли", answers: ["Возникает благодаря ультрафиолетовым лучам", "Способствует небольшому перепаду дневных и ночных температур", "Используют для загара"], correct: 1 },
            { id: 48, question: "В медицине, для противомикробной обработки помещения используют", answers: ["Видимый свет", "Инфракрасные лучи", "Ультрафиолетовые лучи", "Рентгеновские лучи", "γ-излучение"], correct: 2 }
        ];

        let currentTestQuestions = [];
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let timePerQuestion = 0;
        let timerInterval = null;
        let questionTimeLeft = 0;
        let testStartTime = null;
        let testEndTime = null;

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const newTheme = current === 'dark' ? '' : 'dark';
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', newTheme);
        }

        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggle').textContent = '☀️';
            }
        })();

        function showScreen(id) {
            ['selectionScreen','testScreen','resultScreen','referenceScreen'].forEach(s => document.getElementById(s).style.display = 'none');
            if (id) document.getElementById(id).style.display = 'block';
        }

        function goToSelection() { stopTimer(); showScreen('selectionScreen'); }
        function confirmExitTest() {
            if (currentQuestionIndex < currentTestQuestions.length && userAnswers.some(a => a !== null)) {
                if (confirm('Есть неотвеченные вопросы. Выйти?')) { stopTimer(); goToSelection(); }
            } else { stopTimer(); goToSelection(); }
        }

        function startTest(startId, endId) {
            const filtered = allQuestions.filter(q => q.id >= startId && q.id <= endId);
            if (!filtered.length) { alert('Нет вопросов'); return; }
            currentTestQuestions = [...filtered];
            startTestSession();
        }

        function startRandomTest() {
            const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
            currentTestQuestions = shuffled.slice(0, 20);
            startTestSession();
        }

        function startTestSession() {
            currentQuestionIndex = 0;
            userAnswers = new Array(currentTestQuestions.length).fill(null);
            timePerQuestion = parseInt(document.getElementById('timePerQuestion').value) || 0;
            testStartTime = new Date();
            testEndTime = null;
            showScreen('testScreen');
            showQuestion();
        }

        function startQuestionTimer() {
            stopTimer();
            if (timePerQuestion <= 0) { document.getElementById('timerBar').style.display = 'none'; return; }
            document.getElementById('timerBar').style.display = 'flex';
            questionTimeLeft = timePerQuestion;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                questionTimeLeft -= 0.1;
                if (questionTimeLeft <= 0) {
                    questionTimeLeft = 0;
                    stopTimer();
                    if (userAnswers[currentQuestionIndex] === null) userAnswers[currentQuestionIndex] = -1;
                    if (currentQuestionIndex < currentTestQuestions.length - 1) { currentQuestionIndex++; showQuestion(); }
                    else showResult();
                }
                updateTimerDisplay();
            }, 100);
        }

        function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }

        function updateTimerDisplay() {
            const sec = Math.ceil(questionTimeLeft);
            const percent = (questionTimeLeft / timePerQuestion) * 100;
            const fill = document.getElementById('timerFill');
            fill.style.width = percent + '%';
            fill.classList.remove('warning','danger');
            if (percent <= 25) fill.classList.add('danger');
            else if (percent <= 50) fill.classList.add('warning');
            document.getElementById('timerText').textContent = sec + 'с';
        }

        function showQuestion() {
            if (currentQuestionIndex >= currentTestQuestions.length) { showResult(); return; }
            const q = currentTestQuestions[currentQuestionIndex];
            document.getElementById('questionNumber').textContent = `Вопрос ${currentQuestionIndex+1} из ${currentTestQuestions.length}`;
            document.getElementById('originalNumber').textContent = `№${q.id}`;
            document.getElementById('questionText').textContent = q.question;
            const progress = (currentQuestionIndex / currentTestQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            const container = document.getElementById('answersContainer');
            container.innerHTML = '';
            q.answers.forEach((ans, idx) => {
                const div = document.createElement('div');
                div.className = 'answer-option';
                div.innerHTML = `<div class="radio"></div><span>${ans}</span>`;
                if (userAnswers[currentQuestionIndex] === idx) div.classList.add('selected');
                div.onclick = () => selectAnswer(idx);
                container.appendChild(div);
            });
            updateNavButtons();
            startQuestionTimer();
        }

        function selectAnswer(idx) {
            userAnswers[currentQuestionIndex] = idx;
            document.querySelectorAll('.answer-option').forEach((opt, i) => opt.classList.toggle('selected', i === idx));
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('nextBtn').textContent = currentQuestionIndex === currentTestQuestions.length-1 ? 'Завершить' : 'Вперед →';
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) return;
            stopTimer();
            if (currentQuestionIndex < currentTestQuestions.length-1) { currentQuestionIndex++; showQuestion(); document.getElementById('nextBtn').disabled = true; document.getElementById('nextBtn').textContent = 'Выберите ответ'; }
            else showResult();
        }

        function prevQuestion() {
            stopTimer();
            if (currentQuestionIndex > 0) { currentQuestionIndex--; showQuestion(); const answered = userAnswers[currentQuestionIndex] !== null; document.getElementById('nextBtn').disabled = !answered; document.getElementById('nextBtn').textContent = currentQuestionIndex === currentTestQuestions.length-1 ? 'Завершить' : 'Вперед →'; }
        }

        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            const answered = userAnswers[currentQuestionIndex] !== null;
            document.getElementById('nextBtn').disabled = !answered;
        }

        function formatTime(sec) { const m = Math.floor(sec/60); const s = Math.floor(sec%60); return `${m}:${s.toString().padStart(2,'0')}`; }

        async function showResult() {
            stopTimer();
            testEndTime = new Date();
            const totalSec = Math.round((testEndTime - testStartTime)/1000);
            showScreen('resultScreen');
            let correct = 0;
            currentTestQuestions.forEach((q,i) => { if (userAnswers[i] === q.correct) correct++; });
            const total = currentTestQuestions.length;
            const percent = Math.round(correct/total*100);
            document.getElementById('totalQuestions').textContent = total;
            document.getElementById('correctAnswers').textContent = correct;
            document.getElementById('percentage').textContent = percent+'%';
            document.getElementById('timeElapsed').textContent = formatTime(totalSec);
            let gradeClass = '';
            let gradeText = '';
            if (percent>=85) { gradeText='5 (Отлично)'; gradeClass='excellent'; }
            else if (percent>=70) { gradeText='4 (Хорошо)'; gradeClass='good'; }
            else if (percent>=50) { gradeText='3 (Удовлетворительно)'; gradeClass='satisfactory'; }
            else { gradeText='2 (Неудовлетворительно)'; gradeClass='poor'; }
            const gradeEl = document.getElementById('grade');
            gradeEl.textContent = `Оценка: ${gradeText} | Время: ${formatTime(totalSec)}`;
            gradeEl.className = 'grade '+gradeClass;
            const details = document.getElementById('resultDetails');
            details.innerHTML = '';
            [...currentTestQuestions].sort((a,b)=>a.id-b.id).forEach((q,iOrig) => {
                const idx = currentTestQuestions.findIndex(qq=>qq.id===q.id);
                const isCorrect = userAnswers[idx] === q.correct;
                const div = document.createElement('div');
                div.className = `result-item ${isCorrect ? 'correct' : 'wrong'}`;
                let text = `${q.id}. ${isCorrect ? '✓' : '✗'} `;
                if (userAnswers[idx] !== null && userAnswers[idx] !== -1) text += `Ваш ответ: ${q.answers[userAnswers[idx]]}`;
                else if (userAnswers[idx] === -1) text += 'Время вышло';
                else text += 'Нет ответа';
                if (!isCorrect) text += ` | Правильно: ${q.answers[q.correct]}`;
                div.textContent = text;
                details.appendChild(div);
            });
            await loadLeaderboard();
        }

        async function loadLeaderboard() {
            const list = document.getElementById('leaderboardList');
            if (!list) return;
            list.innerHTML = 'Загрузка...';
            const snapshot = await db.collection('leadersWaveOptics').orderBy('percent', 'desc').orderBy('time', 'asc').limit(10).get();
            const data = [];
            snapshot.forEach(doc => data.push(doc.data()));
            list.innerHTML = data.map((e,i) => {
                const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}.`;
                return `<div style="padding:4px 0; border-bottom:1px solid var(--border); color:var(--text);">${medal} ${e.name} — ${e.percent}% (${e.correct}/${e.total}) ⏱${e.timeStr}</div>`;
            }).join('');
            if (!data.length) list.innerHTML = 'Пока нет результатов. Будь первым!';
        }

        function addToLeaderboard() {
            const name = document.getElementById('leaderName').value.trim();
            if (!name) { alert('Введите имя!'); return; }
            const correct = parseInt(document.getElementById('correctAnswers').textContent);
            const total = parseInt(document.getElementById('totalQuestions').textContent);
            const percent = parseInt(document.getElementById('percentage').textContent);
            const timeStr = document.getElementById('timeElapsed').textContent;
            const parts = timeStr.split(':');
            const timeSec = parseInt(parts[0])*60 + parseInt(parts[1]);
            db.collection('leadersWaveOptics').add({ name, correct, total, percent, time: timeSec, timeStr })
                .then(() => { document.getElementById('leaderName').value = ''; loadLeaderboard(); })
                .catch(err => alert('Ошибка: '+err.message));
        }

        function retryTest() {
            stopTimer();
            userAnswers = new Array(currentTestQuestions.length).fill(null);
            currentQuestionIndex = 0;
            testStartTime = new Date();
            testEndTime = null;
            showScreen('testScreen');
            showQuestion();
        }

        function showReference() {
            showScreen('referenceScreen');
            const content = document.getElementById('referenceContent');
            content.innerHTML = '';
            allQuestions.forEach(q => {
                const div = document.createElement('div');
                div.className = 'reference-item';
                div.innerHTML = `<div class="ref-question">${q.id}. ${q.question}</div><div class="ref-answer">✓ ${q.answers[q.correct]}</div>`;
                content.appendChild(div);
            });
        }

        showScreen('selectionScreen');
    </script>
